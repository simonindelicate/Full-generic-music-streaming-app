<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   ▼▼▼  YOUR SITE ADDRESS GOES HERE  ▼▼▼
   This is the only line you need to change. Put your own site's address
   between the quote marks (no slash on the end).
   ========================================================================== */
const BASE_URL = 'https://coporatemusicsolution1.netlify.app';

/* ==========================================================================
   STATION BEHAVIOUR
   These are the defaults. Anything changed in the station settings panel
   overrides them for that browser; choose "As set in the file" there to
   come back to these.
   ========================================================================== */
const STATION = {
  // How the station programmes the catalogue. Listeners can switch this in the settings panel;
  // this is the starting choice.
  //   'artist'  - "Curated Artist Radio". For a catalogue that is one act plus its side projects and
  //               solo records. Plays anything in the catalogue, and every so often runs a short
  //               segment: an era, a spotlight on one record, deeper cuts or live recordings.
  //   'singles' - "Random Artist Radio". One song at a time with no segments. Choices follow record,
  //               year, genre and recording type, and ignore the artist field entirely.
  //   'mixed'   - "Mixed Catalogue". For wide catalogues with many artists: like 'artist', plus
  //               segments for genres and individual artists.
  // Wherever there are segments, the station plays at least three songs freely before it considers
  // starting one, and no segment is longer than three songs.
  curation: 'artist',

  // The act the station is about, for the presenter's framing. Leave empty to use whoever has the
  // most songs in the catalogue.
  mainArtist: '',

  // Records kept off the air entirely, by title or by id. Matching ignores capitals.
  // For example: exclude: ['Elevator Music', 'DoE "Part 4" DLC'],
  exclude: [],

  // How the presenter meets the next song. After every link the song comes in under the presenter's
  // last few words, starting this many seconds before they finish (a random point in the range).
  // Now and then, at the rate below, the presenter finishes completely before the song starts.
  overlapSeconds: [2, 5],
  clearChance: 0.2,
  pauseBeforeTalk: 0.8     // seconds of quiet between the end of a song and the presenter
};
/* ========================================================================== */
</script>
<style>
@property --h  { syntax:'<number>'; inherits:true; initial-value:25 }
@property --c  { syntax:'<number>'; inherits:true; initial-value:.04 }
:root{
  --h:25; --c:.04;
  --bg:     oklch(.175 calc(var(--c) * .35) var(--h));
  --bg2:    oklch(.215 calc(var(--c) * .4) var(--h));
  --raise:  oklch(.29 calc(var(--c) * .45) var(--h) / .5);
  --ink:    oklch(.965 .008 var(--h));
  --muted:  oklch(.76 .018 var(--h));
  --faint:  oklch(.57 .018 var(--h));
  --line:   oklch(.96 .01 var(--h) / .1);
  --accent: oklch(.85 clamp(.05, calc(var(--c) * 1.1), .15) var(--h));
  --on-accent: oklch(.2 .03 var(--h));
  --air: oklch(.64 .21 25);
  --ease: cubic-bezier(.2,.8,.2,1);
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --pad: clamp(18px, 4vw, 56px);
  transition: --h 1.6s var(--ease), --c 1.6s var(--ease);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 15px/1.55 var(--sans);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  background:radial-gradient(110% 70% at 20% -10%, oklch(.42 calc(var(--c) * .9) var(--h) / .42), transparent 65%) fixed, var(--bg)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{text-wrap:balance} p{text-wrap:pretty}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:18px;padding:18px var(--pad)}
.station{margin:0 auto 0 0;font:400 clamp(1.5rem,2.6vw,2.1rem)/1 var(--serif);letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onair{display:inline-flex;flex:none;white-space:nowrap;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--faint);border:1px solid var(--line);transition:color .4s,background .4s,border-color .4s}
.onair i{width:8px;height:8px;border-radius:50%;background:currentColor}
body.on .onair{color:#fff;background:var(--air);border-color:transparent;box-shadow:0 0 24px -4px var(--air)}
body.on .onair i{animation:pulse 1.6s ease-in-out infinite}
body.on.paused .onair{color:var(--ink);background:var(--raise);border-color:var(--line);box-shadow:none}
body.on.paused .onair i{animation:none}
@keyframes pulse{50%{opacity:.35}}
.clock{font:500 14px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:8ch;text-align:right}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.icon-btn:hover{color:var(--ink);background:var(--raise)}
.icon-btn svg{width:19px;height:19px}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:clamp(24px,4vw,64px);padding:clamp(8px,2vw,28px) var(--pad) 48px;max-width:1560px;margin:0 auto}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
main > *,.now > *{min-width:0}

/* ---------- off air ---------- */
.offair{position:relative;min-height:min(72vh,720px);display:grid;align-content:center;border-radius:20px;overflow:hidden;padding:clamp(28px,5vw,72px)}
.mosaic{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;transform:rotate(-8deg);opacity:.32;animation:drift 80s linear infinite alternate;pointer-events:none;
  -webkit-mask-image:radial-gradient(70% 70% at 70% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(70% 70% at 70% 50%,#000 20%,transparent 75%)}
.mosaic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
@keyframes drift{to{transform:rotate(-8deg) translate(-6%,-8%)}}
.offair-in{position:relative;max-width:640px}
.eyebrow{margin:0 0 16px;color:var(--muted);font-size:14px}
.big{margin:0;font:400 clamp(3rem,8vw,7.4rem)/.92 var(--serif);letter-spacing:-.025em;overflow-wrap:break-word}
.lede{margin:24px 0 0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.15rem);max-width:44ch}
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 26px 0 22px;border-radius:999px;font-weight:550;font-size:15px;transition:transform .35s var(--ease),background .25s,box-shadow .35s var(--ease)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px -10px oklch(.7 .12 var(--h) / .6)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.quiet{background:var(--raise);border:1px solid var(--line);padding:0 22px}
.btn:disabled{opacity:.7;cursor:progress}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tune{margin-top:36px}
.hint{margin:16px 0 0;color:var(--faint);font-size:13.5px}

/* ---------- on air ---------- */
.onair-view{display:none}
body.on .onair-view,body.was-on .onair-view{display:block}
body.on .offair,body.was-on .offair{display:none}
.now{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(22px,3.5vw,52px);align-items:end}
@media (max-width:720px){.now{grid-template-columns:minmax(0,1fr)}.art{max-width:min(100%,58vh)}}
.art{position:relative;aspect-ratio:1;width:100%;max-width:520px}
.art .glow{position:absolute;inset:8%;border-radius:12px;background:oklch(.62 calc(var(--c) * 1.6 + .02) var(--h));filter:blur(60px);opacity:.5;transform:translateY(8%)}
.art img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:8px;box-shadow:0 30px 80px -30px rgb(0 0 0/.75);transition:opacity .6s}
.art img.fade{opacity:0}
.segment{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13.5px;color:var(--accent)}
.segment::before{content:'';width:18px;height:1px;background:currentColor}
.title{margin:0;font:400 clamp(2.4rem,5.4vw,5rem)/.95 var(--serif);letter-spacing:-.02em;overflow-wrap:break-word;hyphens:auto}
.title.long{font-size:clamp(2rem,4vw,3.6rem);line-height:1}
.title.xlong{font-size:clamp(1.7rem,3vw,2.7rem);line-height:1.05}
.by{margin:16px 0 0;color:var(--muted);font-size:1.08rem}
.bar{margin-top:30px;height:3px;border-radius:3px;background:oklch(.96 .01 var(--h) / .12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s linear}
.times{display:flex;justify-content:space-between;margin-top:8px;font:500 12.5px/1 var(--mono);color:var(--faint)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);color:var(--ink);transition:transform .3s var(--ease),background .2s,color .2s}
.round:hover{transform:scale(1.06)}
.round svg{width:20px;height:20px}
.round[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.vol{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--faint)}
.vol svg{width:18px;height:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:20px;background:transparent;cursor:pointer;--p:90%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),oklch(.96 .01 var(--h) / .14) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),oklch(.96 .01 var(--h) / .14) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink)}
.next{display:flex;align-items:center;gap:14px;margin-top:40px;padding:12px;border-radius:14px;background:var(--raise);border:1px solid var(--line);max-width:520px}
.next img{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.next small{display:block;color:var(--faint);font-size:12.5px}
.next b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next div{min-width:0}

/* ---------- side: presenter + log ---------- */
aside{display:flex;flex-direction:column;gap:22px;min-width:0}
.presenter{padding:22px;border-radius:18px;background:var(--raise);border:1px solid var(--line)}
.p-head{display:flex;align-items:center;gap:14px}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:italic 22px/1 var(--serif);background:var(--bg2);flex:none;--lv:0}
.avatar::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--lv) * 360deg),transparent 0);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(closest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));opacity:.9}
.p-name{font-weight:600}
.p-role{color:var(--faint);font-size:13px}
.chip{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.caption{margin:18px 0 0;font:400 1.32rem/1.45 var(--serif);min-height:2.9em;color:var(--muted)}
.caption span{opacity:.28;transition:opacity .25s}
.caption span.on{opacity:1;color:var(--ink)}
.caption.idle{font-style:italic;font-size:1.05rem;color:var(--faint)}
.log h3{margin:0 0 10px;font:italic 400 1.25rem/1 var(--serif);color:var(--muted)}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:min(56vh,620px);overflow:auto;scrollbar-width:thin}
.log li{display:grid;grid-template-columns:48px 36px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;animation:in .5s var(--ease)}
.log li:hover{background:var(--raise)}
.log time{font:500 12px/1 var(--mono);color:var(--faint)}
.log img{width:36px;height:36px;border-radius:4px;object-fit:cover}
.log .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .s{color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log li.talk{grid-template-columns:48px minmax(0,1fr)}
.log li.talk p{margin:0;font:italic 400 1rem/1.4 var(--serif);color:var(--muted)}
.log .icon-btn{width:32px;height:32px;opacity:0}
.log li:hover .icon-btn,.log .icon-btn:focus-visible{opacity:1}
@media (hover:none){.log .icon-btn{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.empty-log{color:var(--faint);font-size:14px;padding:8px 6px}

/* ---------- settings sheet ---------- */
dialog.sheet{margin:0 0 0 auto;width:min(480px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;padding:0;border:0;background:var(--bg2);color:var(--ink);overflow:auto;
  box-shadow:-30px 0 80px -30px rgb(0 0 0/.7);opacity:0;transform:translateX(40px);transition:opacity .3s var(--ease),transform .45s var(--ease),overlay .45s allow-discrete,display .45s allow-discrete}
dialog.sheet[open]{opacity:1;transform:none}
@starting-style{dialog.sheet[open]{opacity:0;transform:translateX(40px)}}
dialog.sheet::backdrop{background:rgb(6 6 8/.55);backdrop-filter:blur(6px)}
.sheet-in{padding:22px clamp(22px,4vw,36px) 40px}
.sheet-in h2{margin:0;font:400 2.2rem/1 var(--serif)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.field{display:block;margin:0 0 20px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field input[type=password],.field select{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise);outline:none}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.field select option{background:#222;color:#eee}
.field input:focus,.field select:focus{border-color:oklch(.96 .01 var(--h) / .35)}
.field small{display:block;margin-top:7px;color:var(--faint);font-size:12.5px;line-height:1.45}
.check{display:flex;align-items:center;gap:10px;margin:0 0 20px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
details{margin:6px 0 20px;border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:14px}
.status{font-size:13px;color:var(--faint);padding:12px 14px;border-radius:12px;background:var(--raise);line-height:1.45}
.status .bad{color:oklch(.8 .12 30)}
.status .good{color:oklch(.85 .1 150)}
.tag-standby{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
#toast{position:fixed;inset:auto auto 28px 50%;margin:0;border:0;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:550;font-size:14px;transform:translate(-50%,8px);opacity:0;transition:opacity .3s,transform .4s var(--ease),overlay .4s allow-discrete,display .4s allow-discrete}
#toast:popover-open,#toast.show{opacity:1;transform:translate(-50%,0)}
@starting-style{#toast:popover-open{opacity:0;transform:translate(-50%,8px)}}
.note{max-width:520px;margin:14vh auto;text-align:center}
.note h2{font:400 2.4rem/1.05 var(--serif);margin:0 0 12px}
.note p{color:var(--muted)}
.note code{font-size:13px;background:var(--raise);padding:2px 8px;border-radius:6px;word-break:break-all}
.sk{background:linear-gradient(100deg,var(--raise) 30%,oklch(.4 calc(var(--c) * .5) var(--h) / .45) 50%,var(--raise) 70%) 0 0/300% 100%;animation:sheen 1.6s linear infinite;border-radius:14px}
@keyframes sheen{from{background-position:150% 0}to{background-position:-150% 0}}
@media (max-width:560px){
  .clock{display:none}.top{gap:10px;padding:14px var(--pad)}.vol{margin-left:0;width:100%}.vol input{flex:1}
  .station{font-size:1.35rem}
  .offair{padding:28px 6px;min-height:0}
  .ctrls{gap:8px}.round{width:46px;height:46px}
}
@media (max-width:370px){.ctrls .btn{width:52px;padding:0;justify-content:center}.ctrls .btn .lbl{display:none}}
@media (max-width:400px){
  .station{font-size:1.15rem}
  .onair{height:26px;padding:0 9px;font-size:11.5px;gap:6px}
  .log li{grid-template-columns:40px 32px minmax(0,1fr) 32px;gap:8px}
  .log li.talk{grid-template-columns:40px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <h1 class="station" id="station">&nbsp;</h1>
  <span class="onair" id="onairPill"><i></i><span id="onairText">Off air</span></span>
  <span class="clock" id="clock" aria-hidden="true"></span>
  <button class="icon-btn" data-action="settings" aria-label="Station settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>

<main id="main">
  <section>
    <div class="offair" id="offair">
      <div class="mosaic" id="mosaic" aria-hidden="true"></div>
      <div class="offair-in" id="offairIn"><div class="sk" style="height:320px"></div></div>
    </div>
    <div class="onair-view">
      <div class="now">
        <div class="art"><span class="glow"></span><img id="art" alt="" width="520" height="520" decoding="async"></div>
        <div>
          <p class="segment" id="segment"></p>
          <h2 class="title" id="title"></h2>
          <p class="by" id="by"></p>
          <div class="bar"><i id="barFill"></i></div>
          <div class="times"><span id="tEl">0:00</span><span id="tRem">-0:00</span></div>
          <div class="ctrls">
            <button class="btn primary" data-action="power" id="powerBtn"></button>
            <button class="round" data-action="stop" id="stopBtn" aria-label="Stop the station" title="Stop the station"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="1.6"/></svg></button>
            <button class="round" data-action="skip" aria-label="Skip this song" title="Skip (→)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5.5h2v13h-2zM5 6.3v11.4a.8.8 0 0 0 1.25.66L14 13.2a1.4 1.4 0 0 0 0-2.4L6.25 5.64A.8.8 0 0 0 5 6.3z"/></svg></button>
            <button class="round" data-action="like" id="likeBtn" aria-pressed="false" aria-label="More like this" title="More like this (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
            <button class="round" data-action="share" aria-label="Copy a link to this song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
            <label class="vol"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4z"/></svg><span class="sr">Volume</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
          </div>
          <div class="next" id="nextBox" hidden><img id="nextArt" alt=""><div><small>Coming up</small><b id="nextTitle"></b></div></div>
        </div>
      </div>
    </div>
  </section>

  <aside>
    <div class="presenter">
      <div class="p-head">
        <div class="avatar" id="avatar"></div>
        <div><div class="p-name" id="pName"></div><div class="p-role" id="pRole"></div></div>

  $('#mosaic').innerHTML = covers.concat(covers).slice(0, 36).map(r => `<img src="${esc(r.artworkUrl)}" alt="" loading="lazy" decoding="async">`).join('');
  const songs = pool.length, recs = releases.filter(r => r.tracks.some(t => pool.includes(t))).length;
  $('#offairIn').innerHTML = `<p class="eyebrow">Continuous programming, chosen as it goes</p>
    <h2 class="big">${esc(settings.station)}</h2>
    <p class="lede">${songs} songs from ${recs} records${curation() === 'artist' ? ', all ' + esc(mainArtist) + ' and the projects around them' : curation() === 'singles' ? ', one song at a time' : ''}, never the same running order twice${presenterOn() ? `, with ${esc(persona().name)} presenting` : ''}.</p>
    <div class="tune"><button class="btn primary" data-action="power" id="powerBtn2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L8.88 4.44A.9.9 0 0 0 7.5 5.2z"/></svg>Tune in</button></div>
    <p class="hint">${presenterOn() ? '' : 'No presenter yet. Add an OpenAI key in station settings for a live AI presenter, or choose simple browser announcements.'}</p>`;
  if (covers[0]) tintFrom(covers[0].artworkUrl, covers[0].id);
  renderPresenter(); setPowerBtn('off');
}
function renderPresenter() {
  const p = persona();
  $('#avatar').textContent = p.name.replace(/^Mr /, '').charAt(0);
  $('#pName').textContent = presenterOn() ? p.name : 'No presenter';
  $('#pRole').textContent = presenterOn() ? p.label : (aiScript() ? 'Add an OpenAI key or relay in settings' : 'Music only');
  $('#pChip').hidden = !presenterOn();
  $('#pChip').textContent = settings.voice === 'ai' ? 'AI voice' : settings.voice === 'aibrowser' ? 'AI script' : 'Browser voice';
  const cap = $('#caption');
  if (!talking) { cap.className = 'caption idle'; cap.textContent = presenterOn() ? `${p.name} will be on between songs.` : 'The station runs without a presenter.'; }
}
function setPowerBtn(state) {
  const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L8.88 4.44A.9.9 0 0 0 7.5 5.2z"/></svg>';
  const [icon, label] = state === 'warming' ? ['<span class="spin"></span>', 'Warming up']
    : state === 'on' ? ['<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>', 'Pause']
    : state === 'paused' ? [play, 'Resume'] : [play, 'Tune in'];
  ['#powerBtn', '#powerBtn2'].forEach(s => { const b = $(s); if (b) { b.innerHTML = icon + `<span class="lbl">${label}</span>`; b.disabled = state === 'warming'; b.setAttribute('aria-label', label); } });
  $('#stopBtn').hidden = state === 'off';
  $('#onairText').textContent = state === 'off' ? 'Off air' : state === 'paused' ? 'Paused' : 'On air';
}
function showNow(plan) {
  const t = plan.track, img = $('#art'), url = artOf(t);
  img.classList.add('fade');
  const pre = new Image(); pre.onload = pre.onerror = () => { img.src = url; img.classList.remove('fade'); }; pre.src = url;
  $('#segment').textContent = plan.block ? plan.block.name : ''; $('#segment').hidden = !plan.block;
  $('#barFill').style.width = '0'; $('#tEl').textContent = '0:00'; $('#tRem').textContent = '-' + fmt(t.durationSeconds);
  const ti = $('#title'); ti.textContent = t.title; ti.className = 'title' + sizeClass(t.title);
  $('#by').textContent = [t.artist, t.release.title, yearOf(t) || ''].filter(Boolean).join(', ');
  $('#likeBtn').setAttribute('aria-pressed', String(!!taste.liked[t.id]));
  tintFrom(url, t.release.id); updateTitle();
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: settings.station, artwork: [{ src: url, sizes: '512x512' }] });
      navigator.mediaSession.playbackState = 'playing';
    } catch (_) {}
  }
}
function showNext(plan) {
  const box = $('#nextBox');
  if (!plan) { box.hidden = true; return; }
  box.hidden = false; $('#nextArt').src = artOf(plan.track);
  $('#nextTitle').textContent = `${plan.track.title}${plan.track.artist !== mainArtist ? ', ' + plan.track.artist : ''}`;
}
function updateTitle() { document.title = on && curPlan ? `${paused ? '❚❚' : '●'} ${curPlan.track.title} – ${settings.station}` : settings.station; }
function pushLog(html) {
  const ol = $('#log'); const e = ol.querySelector('.empty-log'); if (e) e.remove();
  ol.insertAdjacentHTML('afterbegin', html);
  while (ol.children.length > 80) ol.lastElementChild.remove();
}
function logSong(plan) {
  const t = plan.track;
  pushLog(`<li><time>${hhmm(new Date())}</time><img src="${esc(artOf(t))}" alt="" loading="lazy"><div style="min-width:0"><div class="t" title="${esc(t.title)}">${esc(t.title)}</div><div class="s">${esc(t.artist)}, ${esc(t.release.title)}</div></div>
    <button class="icon-btn" data-action="share-id" data-id="${esc(t.id)}" aria-label="Copy a link to ${esc(t.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button></li>`);
}
function logTalk(link) { pushLog(`<li class="talk"><time>${hhmm(new Date())}</time><p>${esc(link.persona.name)}: ${esc(link.text)}${link.source === 'ai' ? '' : '<span class="tag-standby">standby script</span>'}${link.mode === 'browser' && settings.voice === 'ai' ? '<span class="tag-standby">browser voice</span>' : ''}</p></li>`); }
async function share(id) {
  const url = API + '/s/' + encodeURIComponent(id);
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (_) {
    const ta = document.createElement('textarea'); ta.value = url; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (__) {} ta.remove();
  }
  if (ok) toast('Link copied'); else window.prompt('Copy this link:', url);
}
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
$('#clock').textContent = new Date().toLocaleTimeString('en-GB');

/* ---------- volume ---------- */
const volEl = $('#vol');
function paintVol() { volEl.style.setProperty('--p', (volume * 100).toFixed(1) + '%'); }
volEl.value = volume = LS.get('volume', .9); paintVol();
volEl.addEventListener('input', () => {
  volume = +volEl.value; paintVol(); LS.set('volume', volume);
  if (cur >= 0) { const el = decks[cur]; clearInterval(el._ramp); el.volume = talking ? volume * DUCK : volume; }
  voiceEl.volume = clamp(volume * 1.1, 0, 1);
});

/* ---------- settings ---------- */
const dlg = $('#settings');
$('#sPersona').innerHTML = PERSONAS.map(p => `<option value="${p.id}">${esc(p.name)}, ${esc(p.label.toLowerCase())}</option>`).join('');
function openSettings() {
  $('#sStation').value = settings.station; $('#sPersona').value = settings.persona; $('#sVoice').value = settings.voice;
  $('#sKey').value = settings.key; $('#sTalk').value = settings.talk; $('#sFade').checked = !!settings.fade; $('#sWake').checked = !!settings.wake;
  $('#sTextModel').value = settings.textModel; $('#sTtsModel').value = settings.ttsModel; $('#sApiBase').value = settings.apiBase;
  $('#sCuration').value = settings.curation || '';
  dlg.showModal();
}
const bindField = (sel, key, prop = 'value') => $(sel).addEventListener(prop === 'checked' ? 'change' : 'input', e => {
  settings[key] = prop === 'checked' ? e.target.checked : e.target.value.trim();
  saveSettings(); renderPresenter();
  if (key === 'station') { $('#station').textContent = settings.station || ' '; updateTitle(); }
  if (!on && ['station', 'persona', 'voice', 'key', 'curation'].includes(key) && document.body.classList.contains('was-on') === false && $('#offairIn .big')) renderIdle();
});
bindField('#sStation', 'station'); bindField('#sPersona', 'persona'); bindField('#sVoice', 'voice'); bindField('#sKey', 'key');
bindField('#sTalk', 'talk'); bindField('#sFade', 'fade', 'checked'); bindField('#sWake', 'wake', 'checked');
$('#sWake').addEventListener('change', syncWake); bindField('#sCuration', 'curation');
$('#sCuration').addEventListener('input', () => { if (!pool.length) return; buildBlocks(); sched.left = 0; if (!on) renderIdle(); toast('The new programming starts after this song'); }); bindField('#sTextModel', 'textModel'); bindField('#sTtsModel', 'ttsModel'); bindField('#sApiBase', 'apiBase');
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- presenter self-test ---------- */
async function testPresenter() {
  if (!settings.key && !usingRelay()) { setStatus('script', 'add an OpenAI key first.', 'bad'); setStatus('voice', 'add an OpenAI key first.', 'bad'); return; }
  const btn = $('#testBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Testing';
  const sample = pool[Math.floor(Math.random() * pool.length)];
  const plan = { track: sample, block: blockOptions[0], blockStart: true };
  let text = null;
  try { setStatus('script', 'testing…'); text = await writeScript('open', null, plan); setStatus('script', `working (${settings.textModel}). It wrote: “${text}”`, 'good'); }
  catch (e) { setStatus('script', 'failed: ' + describeErr(e), 'bad'); }
  if (settings.voice === 'aibrowser') {
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text || `This is ${settings.station}. Testing, testing.`), v = pickBrowserVoice(), bp = persona().browser || {};
      if (v) u.voice = v; u.rate = bp.rate || 1; u.pitch = bp.pitch || 1; u.volume = clamp(volume, .2, 1);
      speechSynthesis.speak(u);
      setStatus('voice', `the browser's own voice${v ? ' (' + v.name + ')' : ''}. You should hear it now.`, 'good');
    } else setStatus('voice', "this browser has no built-in voice.", 'bad');
    btn.disabled = false; btn.textContent = 'Test the presenter'; return;
  }
  try {
    setStatus('voice', 'testing…');
    const url = await speakToFile(text || `This is ${settings.station}. Testing, testing.`);
    setStatus('voice', `working (${settings.ttsModel}). You should hear it now.`, 'good');
    const a = new Audio(url); a.volume = clamp(volume, .2, 1); a.onended = () => URL.revokeObjectURL(url); a.play().catch(() => {});
  } catch (e) { setStatus('voice', 'failed: ' + describeErr(e), 'bad'); }
  btn.disabled = false; btn.textContent = 'Test the presenter';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  switch (el.dataset.action) {
    case 'power': !on ? tuneIn() : paused ? resume() : pause(); break;
    case 'stop': stop(); break;
    case 'skip': skip(); break;
    case 'like': toggleLike(); break;
    case 'share': if (curPlan) share(curPlan.track.id); break;
    case 'share-id': share(el.dataset.id); break;
    case 'settings': openSettings(); break;
    case 'close-settings': dlg.close(); break;
    case 'test': testPresenter(); break;
    case 'reset-taste': taste = { g: {}, r: {}, a: {}, liked: {}, skipped: {} }; recentPlays = []; LS.set('taste', taste); LS.set('recent', recentPlays); toast('Listening history forgotten'); break;
  }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea' || dlg.open) return;
  if (e.code === 'Space') { e.preventDefault(); !on ? tuneIn() : paused ? resume() : pause(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); skip(); }
  else if (e.key.toLowerCase() === 'l') toggleLike();
});
document.addEventListener('error', e => { const img = e.target; if (img.tagName === 'IMG' && !img.dataset.fb) { img.dataset.fb = '1'; img.src = artFallback(img.src); } }, true);
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => on ? resume() : tuneIn());
    navigator.mediaSession.setActionHandler('pause', () => pause());
    navigator.mediaSession.setActionHandler('stop', () => stop());
    navigator.mediaSession.setActionHandler('nexttrack', () => skip());
  } catch (_) {}
}

renderPresenter();
load();
})();
</script>
