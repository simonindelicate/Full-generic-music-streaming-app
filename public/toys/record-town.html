<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Record Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<script>
/* ==========================================================================

<style>
:root{--wb-blue:#0055aa;--wb-white:#ffffff;--wb-black:#000022;--wb-orange:#ff8800;--ui:'Pixelify Sans',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:400 16px/1.35 var(--ui);-webkit-font-smoothing:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#screen{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}

/* HUD */
.hud{position:fixed;z-index:4;pointer-events:none;text-shadow:2px 2px 0 #000}
.hud-l{top:10px;left:12px}
.hud-l b{display:block;font-size:20px;font-weight:700;letter-spacing:.02em}
.hud-l span{font-size:14px;color:#ffcd75}
.hud-r{top:10px;right:12px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700}
.coin{width:22px;height:22px;image-rendering:pixelated}
.hud-r.bump{animation:bump .35s steps(3)}
@keyframes bump{50%{transform:scale(1.25)}}

/* walkman */
.walkman{position:fixed;z-index:4;left:50%;bottom:10px;transform:translate(-50%,160%);transition:transform .35s steps(5);width:min(560px,calc(100% - 20px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:#1a1c2c;border:3px solid #f4f4f4;box-shadow:0 0 0 3px #000,6px 6px 0 3px #000}
.walkman.on{transform:translate(-50%,0)}
.wm-btns{display:flex;gap:6px}
.wm-btns button{width:36px;height:32px;display:grid;place-items:center;background:#333c57;border:2px solid;border-color:#94b0c2 #000 #000 #94b0c2}
.wm-btns button:active{border-color:#000 #94b0c2 #94b0c2 #000}
.wm-btns svg{width:16px;height:16px;image-rendering:pixelated}
.wm-mid{min-width:0}
.wm-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:#ffcd75}
.wm-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#94b0c2}
.wm-bar{height:6px;background:#333c57;margin-top:4px;border:1px solid #000}
.wm-bar i{display:block;height:100%;width:0;background:#a7f070}
.wm-tape{font-size:12px;color:#94b0c2;text-align:right;line-height:1.2}

/* Workbench-style window */
.wb-back{position:fixed;inset:0;z-index:8;display:none;place-items:center;padding:16px;background:rgb(0 0 0/.35)}
.wb-back.open{display:grid}
.wb{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--wb-blue);border:2px solid var(--wb-white);box-shadow:0 0 0 2px var(--wb-black),8px 8px 0 2px rgb(0 0 0/.6);color:var(--wb-white)}
.wb-title{display:flex;align-items:center;gap:8px;height:26px;padding:0 4px;background:repeating-linear-gradient(0deg,var(--wb-white) 0 2px,var(--wb-blue) 2px 4px);border-bottom:2px solid var(--wb-white)}
.wb-title span{background:var(--wb-white);color:var(--wb-blue);padding:0 8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.wb-close{width:20px;height:18px;background:var(--wb-white);border:2px solid var(--wb-black);position:relative;flex:none}
.wb-close::after{content:'';position:absolute;inset:4px;background:var(--wb-black)}
.wb-body{padding:14px 16px;overflow:auto}
.wb-body p{margin:0 0 12px}
.wb-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:0 16px 14px}
.wb-btn{min-width:96px;height:34px;padding:0 14px;background:var(--wb-blue);color:var(--wb-white);font-weight:700;border:2px solid;border-color:var(--wb-white) var(--wb-black) var(--wb-black) var(--wb-white)}
.wb-btn:active,.wb-btn.primary:active{border-color:var(--wb-black) var(--wb-white) var(--wb-white) var(--wb-black)}
.wb-btn.primary{background:var(--wb-orange);color:var(--wb-black)}
.wb-btn:disabled{opacity:.5}
.songs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.songs li{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:5px 6px;border:2px solid transparent}
.songs li.now{border-color:var(--wb-orange);background:rgb(255 136 0/.15)}
.songs .n{color:var(--wb-orange);font-weight:700}
.songs .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songs .d{color:#b8d0ff;font-size:14px}
.songs .play{height:28px;min-width:64px;font-size:14px}
.songs .lock{display:inline-flex;align-items:center;gap:4px;color:#ffcd75;font-size:14px}
.songs .heard{color:#a7f070;font-size:13px;margin-left:6px}
.notes-list{display:flex;flex-direction:column;gap:14px}
.notes-list h4{margin:0 0 4px;color:var(--wb-orange)}
.notes-list p{margin:0;white-space:pre-wrap;line-height:1.45}

/* touch controls */
.pad{position:fixed;z-index:5;bottom:18px;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:block}.walkman{bottom:auto;top:54px}}
.dpad{left:18px;width:150px;height:150px}
.dpad button{position:absolute;width:50px;height:50px;background:rgb(26 28 44/.75);border:3px solid #f4f4f4;color:#f4f4f4;font-weight:700;font-size:20px}
.dpad .u{left:50px;top:0}.dpad .d{left:50px;bottom:0}.dpad .l{left:0;top:50px}.dpad .r{right:0;top:50px}
.abtn{right:22px;width:78px;height:78px;border-radius:50%;background:rgb(177 62 83/.85);border:3px solid #f4f4f4;color:#fff;font-weight:700;font-size:26px;bottom:44px}
.fade{position:fixed;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none;transition:opacity .22s steps(4)}
.fade.on{opacity:1}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="hud hud-l" id="hudL" hidden><b id="hudTown"></b><span id="hudArea"></span></div>
<div class="hud hud-r" id="hudR" hidden><canvas class="coin" id="coinIcon" width="11" height="11"></canvas><span id="coins">0</span></div>

<div class="walkman" id="walkman">
  <div class="wm-btns">
    <button data-action="wm-prev" aria-label="Previous song"><svg viewBox="0 0 8 8" fill="#f4f4f4" shape-rendering="crispEdges"><path d="M1 1h1v6H1zM7 1v6L3 4z"/></svg></button>
    <button data-action="wm-toggle" aria-label="Play or pause" id="wmToggle"></button>
    <button data-action="wm-next" aria-label="Next song"><svg viewBox="0 0 8 8" fill="#f4f4f4" shape-rendering="crispEdges"><path d="M6 1h1v6H6zM1 1v6l4-3z"/></svg></button>
  </div>
  <div class="wm-mid"><div class="wm-t" id="wmT"></div><div class="wm-s" id="wmS"></div><div class="wm-bar"><i id="wmBar"></i></div></div>
  <div class="wm-tape" id="wmTime">0:00</div>
</div>

<div class="wb-back" id="wbBack"><div class="wb" role="dialog" aria-modal="true">
  <div class="wb-title"><button class="wb-close" data-action="wb-close" aria-label="Close"></button><span id="wbTitle"></span></div>
  <div class="wb-body" id="wbBody"></div>
  <div class="wb-actions" id="wbActions"></div>
</div></div>

<div class="pad dpad" id="dpad"><button class="u" data-dir="up">▲</button><button class="l" data-dir="left">◀</button><button class="r" data-dir="right">▶</button><button class="d" data-dir="down">▼</button></div>
<button class="pad abtn" id="abtn" aria-label="Interact">A</button>
<div class="fade" id="fade"></div>

<script>
(() => {
'use strict';

"..#", "..#", ".#.", "#..", "#.."], "+": ["...", ".#.", "###", ".#.", "..."], "\"": ["#.#", "#.#", "...", "...", "..."]};
const GLYPHS = {};
for (const k in GLYPH_ROWS) GLYPHS[k] = GLYPH_ROWS[k].join('');
const normText = s => String(s || '').toUpperCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-');
function drawText(g, str, x, y, color, sc = 1, shadow) {
  str = normText(str);
  if (shadow) drawText(g, str, x + sc, y + sc, shadow, sc);
  g.fillStyle = color;
  let cx = x;
  for (const ch of str) {
    const gl = GLYPHS[ch] || GLYPHS['?'];
    for (let i = 0; i < 15; i++) if (gl[i] === '#') g.fillRect(cx + (i % 3) * sc, y + Math.floor(i / 3) * sc, sc, sc);

const textW = (str, sc = 1) => normText(str).length * 4 * sc - sc;

/* ================= sprites ================= */
const SPR_PAL = { k: P.ink, h: '#6b3e26', s: P.skin, y: P.orange, c: P.blue, p: P.dusk, b: P.plum, m: P.red, w: P.white };
const FRAMES = {
  down: ['...kkkkkk...', '..khhhhhhk..', '.khhhhhhhhk.', 'ykhhhhhhhhky', 'ykssssssssky', 'ykskssssksky', '.kssssssssk.', '..kssmmssk..', '.kcccccccck.', 'kcccccccccck', 'ksccccccccsk', '.kcccccccck.', '.kppppppppk.', '.kppk..kppk.', '.kbbk..kbbk.', '..kk....kk..'],
  up: ['...kkkkkk...', '..khhhhhhk..', '.khhhhhhhhk.', 'ykhhhhhhhhky', 'ykhhhhhhhhky', 'ykhhhhhhhhky', '.khhhhhhhhk.', '..kkhhhhkk..', '.kcccccccck.', 'kcccccccccck', 'ksccccccccsk', '.kcccccccck.', '.kppppppppk.', '.kppk..kppk.', '.kbbk..kbbk.', '..kk....kk..'],
  side: ['...kkkkk....', '..khhhhhk...', '.khhhhhhhk..', '.khhyyyhhhk.', '.khhyyyssssk', '.khhhhssksk.', '..khhsssssk.', '...kssssk...', '...kcccck...', '..kcccccck..', '..kccccsk...', '..kcccccck..', '..kppppppk..', '..kppkkppk..', '..kbbk.kbbk.', '...kk...kk..']
};
const LEGS = {
  down: [null, ['.kppk..kppk.', '.kbbk..kppk.', '..kk...kbbk.'], ['.kppk..kppk.', '.kppk..kbbk.', '.kbbk...kk..']],
  side: [null, ['..kppk.kppk.', '.kbbk...kbbk', '..kk.....kk.'], ['...kpppk....', '...kbbbk....', '....kkk.....']]
};
LEGS.up = LEGS.down;
function paintFrame(rows, flip) {
  const c = document.createElement('canvas'); c.width = 12; c.height = 16; const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = SPR_PAL[ch]; g.fillRect(flip ? 11 - x : x, y, 1, 1); } }));

const SPRITES = {};
for (const dir of ['down', 'up', 'side']) for (let f = 0; f < 3; f++) {

  SPRITES[dir + f] = paintFrame(rows, false);
  if (dir === 'side') SPRITES['left' + f] = paintFrame(rows, true);

/* ================= tiles ================= */
const T = 16;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * .6)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
const TILES = {};
function buildTiles() {
  const mk = (name, fn) => { const c = makeCanvas(T, T); fn(c.getContext('2d'), rng(strHash(name))); TILES[name] = c; };
  for (let v = 0; v < 4; v++) mk('grass' + v, (g, r) => {
    g.fillStyle = P.g2; g.fillRect(0, 0, T, T);

  });

    g.fillStyle = P.path1; g.fillRect(0, 0, T, T);

function paintTree() {
  const c = makeCanvas(32, 32), g = c.getContext('2d');

}
function paintLamp() {
  const c = makeCanvas(16, 32), g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(4, 29, 8, 3);

  else if (o.kind === 'fountain') {
    g.drawImage(OBJ.fountain, o.x, o.y);
    for (let i = 0; i < 6; i++) { const p = ((t / 700) + i / 6) % 1, a = i / 6 * Math.PI * 2; g.fillStyle = P.cyan; g.fillRect(o.x + 24 + Math.cos(a) * p * 14 | 0, o.y + 4 + p * p * 22 - Math.sin(p * Math.PI) * 8 | 0, 1, 2); }
  } else if (o.kind === 'board') g.drawImage(OBJ.board, o.x, o.y);
  else if (o.kind === 'jukebox') { g.drawImage(OBJ.jukebox, o.x, o.y); if (current && !audio.paused && current._rec === state.interior.building.rec) { g.fillStyle = [P.yellow, P.orange, P.red][Math.floor(t / 200) % 3]; g.fillRect(o.x + 4, o.y + 7, 8, 1); } }
  else if (o.kind === 'lectern') g.drawImage(OBJ.lectern, o.x, o.y);
  else if (o.kind === 'plant') g.drawImage(OBJ.plant, o.x, o.y);
  else if (o.kind === 'player') drawPlayer(g);
  else if (o.kind === 'gate') drawGate(g, o);
}
function drawGate(g, o) {
  const open = state.unlocked.has(o.d), x = o.x;
  for (const r of o.rows) {
    const y = r * T;
    g.fillStyle = P.wood4; g.fillRect(x + 6, y - 10, 4, 12); g.fillRect(x + 6, y + 2 * T - 2, 4, 6);
    if (!open) { for (let k = 0; k < 2 * T; k += 4) { g.fillStyle = (k / 4) % 2 ? P.white : P.red; g.fillRect(x + 6, y + k, 4, 4); } g.fillStyle = P.ink; g.fillRect(x + 5, y, 1, 2 * T); g.fillRect(x + 10, y, 1, 2 * T); }
    else { for (let k = 0; k < 20; k += 4) { g.fillStyle = (k / 4) % 2 ? P.white : P.red; g.fillRect(x + 6 + k, y - 12, 4, 3); } }
    if (!open && o.sign) {
      const d = town.districts[o.d], label = `TOLL ${d.cost}`;
      g.fillStyle = P.wood4; g.fillRect(x + 7, y - 26, 2, 16); g.fillRect(x - 6, y - 32, textW(label) + 6, 9); g.fillStyle = P.yellow; g.fillRect(x - 5, y - 31, textW(label) + 4, 7);
      drawText(g, label, x - 3, y - 30, P.ink);
    }
  }
}
function drawPlayer(g) {
  const f = state.moving ? 1 + (Math.floor(state.anim) % 2) : 0;
  const key = (state.dir === 'left' ? 'left' : state.dir === 'right' ? 'side' : state.dir) + f;
  const x = Math.round(state.px - 6), y = Math.round(state.py - 15);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x + 2, y + 14, 8, 3);
  const bob = state.moving && f ? -1 : 0;
  g.drawImage(SPRITES[key], x, y + bob);
  if (current && !audio.paused) { const n = Math.floor(performance.now() / 400) % 2; drawText(g, n ? '"' : "'", x + 12, y - 4 - n, P.yellow); }
}
function render(t) {
  const g = lctx;
  g.fillStyle = '#000'; g.fillRect(0, 0, LW, LH);
  if (state.scene === 'title') return renderTitle(g, t);
  const map = state.scene === 'town' ? town : state.interior;
  const mapW = map.W * T, mapH = map.H * T;
  let cx = Math.round(state.px - LW / 2), cy = Math.round(state.py - LH / 2);
  cx = mapW <= LW ? Math.round((mapW - LW) / 2) : clamp(cx, 0, mapW - LW);
  cy = mapH <= LH ? Math.round((mapH - LH) / 2) : clamp(cy, 0, mapH - LH);
  g.save(); g.translate(-cx, -cy);
  if (state.scene === 'town') {
    g.drawImage(townGround, cx, cy, LW, LH, cx, cy, LW, LH);
    const f = Math.floor(t / 450) % 3;
    for (const rx of town.rivers) for (let y = Math.max(0, Math.floor(cy / T)); y < Math.min(town.H, Math.ceil((cy + LH) / T)); y++) for (let k = 0; k < 3; k++) if (town.ground[y][rx + k] === 'water') g.drawImage(TILES['water' + ((f + y + k) % 3)], (rx + k) * T, y * T);
  } else g.drawImage(map.groundCanvas, 0, 0);
  // interior wall decorations: cover painting and gold discs
  if (state.scene === 'interior') drawInteriorWall(g, t);
  const list = [];
  for (const o of map.objects) if (o.x < cx + LW + 64 && o.x > cx - 160 && o.y < cy + LH + 40 && o.base > cy - 20) list.push(o);
  if (state.scene === 'town') for (const gt of town.gates) gt.rows.forEach((r, i) => list.push({ kind: 'gate', x: gt.x * T, y: r * T, base: (r + 2) * T + 1, d: gt.d, rows: [r], sign: i === 0 }));
  list.push({ kind: 'player', base: state.py });
  list.sort((a, b) => a.base - b.base);
  for (const o of list) drawObject(o, g, t);
  // prompt
  const tg = !state.dialog && findTarget();
  if (tg) {
    const label = tg.kind === 'door' ? (state.unlocked.has(tg.b.district) ? 'E: ENTER' : 'LOCKED') : tg.kind === 'gate' ? 'E: TOLL' : tg.kind === 'jukebox' ? 'E: JUKEBOX' : tg.kind === 'lectern' ? 'E: READ' : tg.kind === 'board' ? 'E: READ' : tg.kind === 'fountain' ? 'E: WISH' : 'E: LOOK';
    const w = textW(label) + 6, x = Math.round(state.px - w / 2), y = Math.round(state.py - 30);
    g.fillStyle = P.ink; g.fillRect(x - 1, y - 1, w + 2, 9); g.fillStyle = P.white; g.fillRect(x, y, w, 7); drawText(g, label, x + 3, y + 1, P.ink);
    if (tg.kind === 'door') { const title = tg.b.rec.title, tw = Math.min(textW(title), 200); const tx = Math.round(state.px - tw / 2); drawText(g, title.length > 50 ? title.slice(0, 49) + '.' : title, tx, y - 9, P.yellow, 1, P.ink); }
  }
  // floating texts
  const now = performance.now();
  state.floats = state.floats.filter(f => now - f.t < 1600);
  for (const f of state.floats) { if (f.scene !== state.scene) continue; const p = (now - f.t) / 1600; drawText(g, f.text, Math.round(f.x - textW(f.text) / 2), Math.round(f.y - p * 18), f.color, 1, P.ink); }
  g.restore();
  // night
  const n = state.scene === 'town' ? nightLevel() : 0;
  if (n > 0) {
    g.fillStyle = `rgba(20,24,70,${n})`; g.fillRect(0, 0, LW, LH);
    g.globalCompositeOperation = 'lighter';
    for (const o of town.objects) {
      if (o.kind === 'lamp' && o.x > cx - 60 && o.x < cx + LW + 60 && o.y > cy - 60 && o.y < cy + LH + 60) { const gr = g.createRadialGradient(o.lx - cx, o.ly - cy, 1, o.lx - cx, o.ly - cy, 40); gr.addColorStop(0, `rgba(255,205,117,${n * .9})`); gr.addColorStop(1, 'rgba(255,205,117,0)'); g.fillStyle = gr; g.fillRect(o.lx - cx - 40, o.ly - cy - 40, 80, 80); }
      if (o.kind === 'building' && o.x > cx - 140 && o.x < cx + LW && o.y > cy - 100 && o.y < cy + LH) for (const w of o.b.windows) { g.fillStyle = `rgba(255,205,117,${n * .8})`; g.fillRect(o.x + w.x - cx, o.y + w.y - cy, w.w, w.h); }
    }
    g.globalCompositeOperation = 'source-over';
  }
}
function drawInteriorWall(g, t) {
  const b = state.interior.building, r = b.rec;
  const pw = 34, px0 = 6 * T - pw / 2, py0 = 5;
  g.fillStyle = P.wood4; g.fillRect(px0 - 3, py0 - 3, pw + 6, pw + 6); g.fillStyle = P.yellow; g.fillRect(px0 - 2, py0 - 2, pw + 4, pw + 4); g.fillStyle = P.wood2; g.fillRect(px0 - 1, py0 - 1, pw + 2, pw + 2);
  if (b.img.complete && b.img.naturalWidth) { g.imageSmoothingEnabled = true; g.drawImage(b.img, px0, py0, pw, pw); g.imageSmoothingEnabled = false; }
  else { g.fillStyle = b.roof; g.fillRect(px0, py0, pw, pw); }
  // one disc per song, gold once heard
  const slots = [];
  const left = [], right = [];
  for (let row = 0; row < 3; row++) {
    for (let x = px0 - 16; x >= T + 4; x -= 12) left.push({ x, y: 8 + row * 12 });
    for (let x = px0 + pw + 6; x <= (state.interior.W - 1) * T - 14; x += 12) right.push({ x, y: 8 + row * 12 });
  }
  for (let i = 0; i < Math.max(left.length, right.length); i++) { if (left[i]) slots.push(left[i]); if (right[i]) slots.push(right[i]); }
  r.tracks.forEach((tr, i) => {
    const s = slots[i]; if (!s) return;
    const heard = state.heard.has(tr.id), playing = current && current.id === tr.id && !audio.paused;
    g.fillStyle = P.wood4; g.fillRect(s.x - 1, s.y - 1, 12, 12);
    g.fillStyle = `hsl(${strHash(r.id) % 360},25%,24%)`; g.fillRect(s.x, s.y, 10, 10);
    const c = tr.gated ? P.dusk : heard ? P.yellow : P.silver, c2 = tr.gated ? P.ink : heard ? P.orange : P.slate;
    disc(g, s.x + 5, s.y + 5, 3, c); g.fillStyle = c2; g.fillRect(s.x + 4, s.y + 4, 2, 2);
    if (playing) { const a = t / 150; px(g, s.x + 5 + Math.round(Math.cos(a) * 3), s.y + 5 + Math.round(Math.sin(a) * 3), P.white); }
    if (tr.gated) { g.fillStyle = P.yellow; g.fillRect(s.x + 3, s.y + 5, 5, 4); g.fillRect(s.x + 4, s.y + 3, 1, 2); g.fillRect(s.x + 6, s.y + 3, 1, 2); }
  });
}

/* ================= Amiga title screen ================= */
let scrollText = '';
function renderTitle(g, t) {
  // copper bars
  for (let y = 0; y < LH; y++) {
    const v = Math.sin(y * .09 + t / 500) * .5 + .5, band = Math.sin(y * .02 - t / 1300);
    const hue = (y * 1.6 + t / 20) % 360;
    g.fillStyle = `hsl(${hue},70%,${8 + v * 14 + (band > .85 ? 30 : 0)}%)`; g.fillRect(0, y, LW, 1);
  }
  // starfield
  for (let i = 0; i < 60; i++) { const sx = (i * 97 + t * (0.02 + (i % 3) * .02)) % LW, sy = (i * 53) % LH; g.fillStyle = i % 3 ? P.silver : P.white; g.fillRect(LW - sx | 0, sy, 1, 1); }
  const name = town ? town.name : 'RECORD TOWN';
  const sc = Math.max(2, Math.min(6, Math.floor((LW - 20) / Math.max(1, textW(name)))));
  const tw = textW(name, sc), tx = Math.round((LW - tw) / 2), ty = Math.round(LH * .26);
  [...normText(name)].forEach((ch, i) => { const oy = Math.round(Math.sin(t / 300 + i * .5) * 3); drawText(g, ch, tx + i * 4 * sc, ty + oy, P.yellow, sc, P.ink); });
  const sub = town ? `${recs.length} RECORDS  ${allTracks.length} SONGS` : 'LOADING THE CATALOGUE...';
  drawText(g, sub, Math.round((LW - textW(sub)) / 2), ty + 6 * sc + 10, P.white, 1, P.ink);
  if (town && Math.floor(t / 500) % 2) { const s = 'PRESS START'; drawText(g, s, Math.round((LW - textW(s, 2)) / 2), Math.round(LH * .62), P.white, 2, P.ink); }
  if (loadError) { const lines = ['THE CATALOGUE WOULD NOT LOAD.', 'CHECK BASE_URL AT THE TOP OF THE FILE.']; lines.forEach((l, i) => drawText(g, l, Math.round((LW - textW(l)) / 2), Math.round(LH * .62) + i * 9, P.red, 1, P.ink)); }
  // sine scroller
  const sy = LH - 22, speed = t / 28, total = textW(scrollText, 2) + LW;
  let x = LW - (speed % total);
  for (const ch of normText(scrollText)) { if (x > -10 && x < LW) drawText(g, ch, Math.round(x), Math.round(sy + Math.sin((x + t / 5) / 22) * 5), P.cyan, 2, P.ink); x += 8; }
}

/* ================= loop ================= */
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (state.scene !== 'title') move(dt);
  render(t);
  sctx.drawImage(low, 0, 0, LW * K, LH * K);
  requestAnimationFrame(frame);
}

/* ================= start ================= */
let loadError = false;
function startGame() {
  if (!town || state.scene !== 'title') return;
  blip('unlock');
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; audio.play().then(() => audio.pause()).catch(() => {});
  fadeTo(() => {
    state.scene = 'town';
    $('#hudL').hidden = false; $('#hudR').hidden = false;
    updateArea();
    if (!save.px) setTimeout(() => openDialog('Welcome', `<p>Welcome to <b>${esc(town.name)}</b>. Every building is a record: walk up to a door and press <b>E</b> (or <b>A</b>) to go in, then play the jukebox.</p><p>Listening earns coins. Spend them at the toll bridges to open the rest of town. The notice board in the square has the details.</p>`, [{ label: "Let's go", primary: true, action: 'wb-close' }]), 400);
  });
}
async function load() {
  resize(); buildTiles();
  OBJ = { tree: paintTree(), lamp: paintLamp(), bench: paintBench(), fountain: paintFountain(), board: paintBoard(), jukebox: paintJukebox(), lectern: paintLectern(), plant: paintPlant() };
  const ci = $('#coinIcon').getContext('2d'); disc(ci, 5, 5, 5, P.ink); disc(ci, 5, 5, 4, P.yellow); ci.fillStyle = P.orange; ci.fillRect(4, 3, 2, 5); px(ci, 3, 3, '#fff3c4');
  requestAnimationFrame(frame);
  try {
    const res = await fetch(API + '/catalogue', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    instance = data.instance || {};
    recs = mergeReleases(data.releases || []).filter(r => r.tracks.length).sort((a, b) => (+a.year || 9999) - (+b.year || 9999) || String(a.title).localeCompare(b.title));
    recs.forEach(r => r.tracks.forEach(t => t._rec = r));
    allTracks = recs.flatMap(r => r.tracks);
    buildTown();
    town.name = `${instance.name || 'Record'} Town`.replace(/\s+Town\s+Town$/, ' Town');
    document.title = town.name; $('#hudTown').textContent = town.name;
    prerenderTown();
    const seed = strHash(recs.map(r => r.id).join('|'));
    if (save.seed !== seed) { state.unlocked = new Set([0]); }
    for (const g of town.gates) if (state.unlocked.has(g.d)) for (const r of g.rows) { town.solid[r][g.x] = false; town.solid[r + 1][g.x] = false; }
    if (save.seed === seed && save.px && !blocked(save.px, save.py)) { state.px = save.px; state.py = save.py; } else { state.px = 7 * T + 8; state.py = 16 * T + 8; }
    $('#coins').textContent = state.coins;
    scrollText = `WELCOME TO ${town.name}  ...  EVERY BUILDING IS A RECORD  ...  WALK IN, PLAY THE JUKEBOX, AND YOUR STEREO KEEPS THE MUSIC GOING  ...  LISTEN TO EARN COINS AND PAY THE TOLLS TO OPEN NEW QUARTERS  ...  GREETINGS TO EVERYONE WHO STILL BUYS RECORDS  ...  `;
  } catch (e) { console.error(e); loadError = true; }
}
load();
})();
