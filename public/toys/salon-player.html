<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   ▼▼▼  WHICH CATALOGUE  ▼▼▼
   Leave BASE_URL empty to use the catalogue of the site this page is served
   from, which is the usual case. Put another site's address between the
   quote marks (no slash on the end) to point this page at that catalogue.
   Visitors can also try any other catalogue by adding
   ?catalogue=https://that-site to the page's address.
   ========================================================================== */
const BASE_URL = '';
/* ========================================================================== */
</script>
<style>
/* The whole site is tinted by the artwork in focus. These three numbers glide smoothly between records. */
@property --h  { syntax:'<number>'; inherits:true; initial-value:165 }
@property --c  { syntax:'<number>'; inherits:true; initial-value:.03 }
@property --h2 { syntax:'<number>'; inherits:true; initial-value:210 }
:root{
  --h:165; --c:.03; --h2:210;
  --bg:     oklch(.185 calc(var(--c) * .35) var(--h));
  --bg2:    oklch(.225 calc(var(--c) * .4) var(--h));
  --raise:  oklch(.30 calc(var(--c) * .45) var(--h) / .55);
  --ink:    oklch(.965 .008 var(--h));
  --muted:  oklch(.76 .018 var(--h));
  --faint:  oklch(.58 .018 var(--h));
  --line:   oklch(.96 .01 var(--h) / .1);
  --accent: oklch(.85 clamp(.05, calc(var(--c) * 1.1), .15) var(--h));
  --on-accent: oklch(.2 .03 var(--h));
  --ease: cubic-bezier(.2,.8,.2,1);
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --pad: clamp(18px, 4.5vw, 64px);
  --player-h: 84px;
  transition: --h 1.4s var(--ease), --c 1.4s var(--ease), --h2 1.4s var(--ease);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 15px/1.55 var(--sans);letter-spacing:-.005em;
  background:radial-gradient(120% 70% at 50% -20%, oklch(.42 calc(var(--c) * .9) var(--h) / .45), transparent 70%) fixed, var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}

/* ---------- header ---------- */
#sentinel{position:absolute;top:0;height:1px;width:1px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:16px var(--pad);transition:background .4s,box-shadow .4s}
.top.scrolled{background:oklch(.185 calc(var(--c) * .35) var(--h) / .72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--raise);display:grid;place-items:center;font:italic 20px/1 var(--serif);flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:550;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(300px,40vw)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:40px;padding:0 16px 0 40px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:inherit;outline:none;transition:border-color .25s,background .25s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:oklch(.96 .01 var(--h) / .3);background:oklch(.32 calc(var(--c) * .5) var(--h) / .7)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;height:30px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);transition:color .3s}
.seg button[aria-pressed=true]{color:var(--on-accent)}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--ease),opacity .3s}
.seg.none .seg-ind{opacity:0}
.seg.none button{color:var(--muted)}

main{padding:0 var(--pad) calc(var(--player-h) + 72px);max-width:1560px;margin:0 auto}

/* ---------- hero (home) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,88px);align-items:center;padding:clamp(20px,5vw,64px) 0 clamp(56px,8vw,112px)}
.hero-art{position:relative;aspect-ratio:1;max-width:620px;width:100%}
.hero-art .glow,.a-art .glow,.room-art .glow{position:absolute;inset:6%;border-radius:12px;background:oklch(.62 calc(var(--c) * 1.6 + .02) var(--h));filter:blur(60px);opacity:.55;z-index:0;transform:translateY(8%)}
.hero-art img,.a-art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:6px;box-shadow:0 30px 80px -30px rgb(0 0 0/.7)}
.kicker{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.display{margin:0;font:400 clamp(3rem,7.4vw,7.2rem)/.94 var(--serif);letter-spacing:-.025em;overflow-wrap:break-word;hyphens:auto}
.hero .display.long,.album .display.long,.room-info .display.long{font-size:clamp(2.3rem,4.6vw,4.5rem);line-height:1}
.hero .display.xlong,.album .display.xlong,.room-info .display.xlong{font-size:clamp(1.9rem,3.3vw,3.2rem);line-height:1.05}
.display em{font-style:italic}
.hero .by{margin:22px 0 0;font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--muted)}
.hero .desc{margin:22px 0 0;max-width:46ch;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px 0 20px;border-radius:999px;font-weight:550;font-size:14.5px;transition:transform .35s var(--ease),background .25s,box-shadow .35s var(--ease)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px -10px oklch(.7 .12 var(--h) / .6)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -12px oklch(.7 .12 var(--h) / .75)}
.btn.quiet{background:var(--raise);border:1px solid var(--line);padding:0 22px}
.btn.quiet:hover{background:oklch(.34 calc(var(--c) * .5) var(--h) / .7)}
.btn:active{transform:scale(.97)}
.intro .hero-art img,.intro .hero-art .glow{animation:settle 1.2s var(--ease) both}
.intro .hero-copy > *{animation:rise .9s var(--ease) both}
.intro .hero-copy > :nth-child(2){animation-delay:.08s}.intro .hero-copy > :nth-child(3){animation-delay:.16s}
.intro .hero-copy > :nth-child(4){animation-delay:.24s}.intro .hero-copy > :nth-child(5){animation-delay:.32s}
@keyframes settle{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@supports (animation-timeline: scroll()){
  .hero-art{animation:drift linear both;animation-timeline:scroll(root);animation-range:0 70vh}
  @keyframes drift{to{transform:translateY(40px) scale(.96);opacity:.55}}
}

/* ---------- sections & record grid ---------- */
.sect{display:flex;align-items:baseline;gap:14px;margin:0 0 28px}
.sect h2{margin:0;font:400 clamp(2rem,3.4vw,2.8rem)/1 var(--serif);letter-spacing:-.015em}
.sect span{color:var(--faint);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(128px,38vw,220px),1fr));gap:clamp(28px,3.4vw,52px) clamp(16px,2.4vw,32px);margin-bottom:clamp(56px,7vw,96px)}
.rec{position:relative;content-visibility:auto;contain-intrinsic-size:auto 300px}
.rec-open{display:block;width:100%;text-align:left}
.rec-art{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--raise);box-shadow:0 14px 34px -18px rgb(0 0 0/.7);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.rec-art img{width:100%;height:100%;object-fit:cover}
.rec:hover .rec-art{transform:translateY(-4px);box-shadow:0 26px 50px -22px rgb(0 0 0/.8),0 0 0 1px var(--line)}
.rec-t{margin-top:14px;font-weight:550;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rec-s{margin-top:2px;color:var(--faint);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-media{position:relative}
.rec-text{margin-top:0}
.rec-play{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);
  box-shadow:0 10px 24px -8px rgb(0 0 0/.6);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .35s var(--ease),transform .45s var(--ease)}
.rec-play svg{width:18px;height:18px;margin-left:2px}
.rec:hover .rec-play,.rec-play:focus-visible{opacity:1;transform:none}
@media (hover:none){.rec-play{opacity:1;transform:none;width:40px;height:40px}}

/* ---------- record page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 8px;border-radius:999px;color:var(--muted);font-size:14px;margin:8px 0 20px;transition:color .2s,background .2s}
.back:hover{color:var(--ink);background:var(--raise)}
.back svg{width:18px;height:18px}
.album{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:end;margin-bottom:clamp(40px,6vw,72px)}
.a-art{position:relative;aspect-ratio:1}
.album .display{font-size:clamp(2.6rem,6vw,5.6rem)}
.album .by{margin:18px 0 4px;font-size:1.15rem}
.album .facts{margin:0;color:var(--faint)}

/* ---------- songs ---------- */
.list{list-style:none;margin:0 0 72px;padding:0}
.trk{display:grid;grid-template-columns:44px minmax(0,1fr) auto 60px 40px;gap:14px;align-items:center;min-height:62px;padding:8px 12px 8px 6px;border-radius:10px;
  cursor:pointer;transition:background .2s;content-visibility:auto;contain-intrinsic-size:auto 62px}
.trk.flat{grid-template-columns:44px 44px minmax(0,1fr) minmax(0,.7fr) auto 60px 40px}
.trk:hover{background:var(--raise)}
.trk.selected{background:oklch(.30 calc(var(--c) * .5) var(--h) / .75)}
.trk-play{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.trk-play .ico{display:none;width:16px;height:16px;color:var(--ink)}
.trk:hover .trk-play .n,.trk-play:focus-visible .n{display:none}
.trk:hover .trk-play .ico.p,.trk-play:focus-visible .ico.p{display:block}
.trk-play:hover{background:var(--accent)}
.trk-play:hover .ico{color:var(--on-accent)}
.trk.locked .trk-play .ico.p{display:none!important}
.trk.locked .trk-play .n{display:none}
.trk.locked .trk-play .ico.l{display:block;color:var(--faint)}
.trk.locked .trk-play:hover{background:none}
.bars{display:none;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;border-radius:2px;background:var(--accent);animation:bar 1s var(--ease) infinite alternate}
.bars i:nth-child(2){animation-delay:-.4s}.bars i:nth-child(3){animation-delay:-.7s}
@keyframes bar{from{height:25%}to{height:100%}}
body.is-playing .trk.playing .bars{display:flex}
body.is-playing .trk.playing .trk-play .n,body.is-playing .trk.playing:hover .trk-play .ico.p{display:none}
body.is-playing .trk.playing:hover .bars{display:none}
body.is-playing .trk.playing:hover .trk-play .ico.pa{display:block}
.trk.playing .trk-t{color:var(--accent)}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--raise)}
.trk-main{min-width:0}
.trk-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-s,.trk-rec{color:var(--faint);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk.locked .trk-t{color:var(--muted)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.lock{display:inline-flex;gap:5px;align-items:center}
.tag.lock svg{width:11px;height:11px}
.trk-dur{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:color .2s,background .2s}
.icon-btn:hover{color:var(--ink);background:var(--raise)}
.icon-btn svg{width:18px;height:18px}
.trk .icon-btn{opacity:0}
.trk:hover .icon-btn,.trk .icon-btn:focus-visible{opacity:1}
@media (hover:none){.trk .icon-btn{opacity:1}}

/* ---------- skeleton, empty, error ---------- */
.sk{background:linear-gradient(100deg,var(--raise) 30%,oklch(.4 calc(var(--c) * .5) var(--h) / .5) 50%,var(--raise) 70%) 0 0/300% 100%;animation:sheen 1.6s linear infinite;border-radius:6px}
@keyframes sheen{from{background-position:150% 0}to{background-position:-150% 0}}
.note{max-width:520px;margin:12vh auto;text-align:center}
.note h2{font:400 clamp(2rem,4vw,3rem)/1.05 var(--serif);margin:0 0 14px}
.note p{color:var(--muted);margin:0 0 28px}
.note code{font-size:13px;background:var(--raise);padding:2px 8px;border-radius:6px;word-break:break-all}

/* ---------- player bar ---------- */
.player{position:fixed;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));width:min(1180px,calc(100% - 28px));min-height:var(--player-h);
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.5fr) auto;align-items:center;gap:clamp(12px,2.4vw,32px);padding:12px 18px 12px 12px;
  border-radius:20px;background:oklch(.24 calc(var(--c) * .45) var(--h) / .72);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  box-shadow:0 24px 60px -20px rgb(0 0 0/.7),inset 0 0 0 1px var(--line);transform:translate(-50%,160%);transition:transform .7s var(--ease)}
.player.on{transform:translate(-50%,0)}
.np{display:flex;align-items:center;gap:14px;min-width:0;text-align:left;border-radius:12px;padding:2px}
.np img{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:none;background:var(--raise)}
.np{width:100%;overflow:hidden}
.np-text{display:block;flex:1;min-width:0;overflow:hidden}
.np-t,.np-s{display:block;white-space:nowrap;overflow:hidden}
.np-t{font-weight:550}
.np-s{color:var(--faint);font-size:13.5px}
.mq{display:inline-block;will-change:transform}
.np-t.over,.np-s.over{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.over .mq{animation:ticker var(--dur,12s) cubic-bezier(.45,0,.55,1) infinite}
@keyframes ticker{0%,20%{transform:translateX(0)}50%,70%{transform:translateX(var(--shift,0))}100%{transform:translateX(0)}}
.ctrl{display:flex;align-items:center;gap:6px}
.ctrl .icon-btn{color:var(--muted)}
.play{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);transition:transform .3s var(--ease),background .3s}
.play:hover{transform:scale(1.06)}
.play:active{transform:scale(.95)}
.play svg{width:20px;height:20px}
.play .pa,body.is-playing .play .p{display:none}
body.is-playing .play .pa{display:block}
.play .p{margin-left:2px}
.time{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-width:0}
.time span{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:3.4ch}
.time span:last-child{text-align:right}
.scrub-wrap{position:relative}
.tip{position:absolute;bottom:22px;left:0;padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;font-variant-numeric:tabular-nums;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .15s}
.scrub-wrap:hover .tip{opacity:1}
@media (hover:none){.tip{display:none}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--p:0%;--buf:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),oklch(.96 .01 var(--h) / .26) var(--p) var(--buf),oklch(.96 .01 var(--h) / .12) var(--buf))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),oklch(.96 .01 var(--h) / .26) var(--p) var(--buf),oklch(.96 .01 var(--h) / .12) var(--buf))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:var(--ink);box-shadow:0 2px 6px rgb(0 0 0/.4);transform:scale(0);transition:transform .2s var(--ease)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .2s var(--ease)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1)}
input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{transform:scale(1)}
.side{display:flex;align-items:center;gap:6px}
.vol{width:96px}
.vol::-webkit-slider-thumb{transform:scale(.8)!important}
.vol::-moz-range-thumb{transform:scale(.8)!important}
.vol-btn .x{display:none}
body.muted .vol-btn .x{display:block}
body.muted .vol-btn .w1,body.muted .vol-btn .w2,body.vol-low .vol-btn .w2{display:none}

/* ---------- listening room ---------- */
.room{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;background:var(--bg);color:var(--ink)}
.room.open{display:block}
.aura{position:absolute;inset:-20%;pointer-events:none}
.aura i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.aura i:nth-child(1){left:0;top:0;background:oklch(.5 calc(var(--c) * 1.4 + .02) var(--h));animation:float1 36s ease-in-out infinite alternate}
.aura i:nth-child(2){right:0;bottom:0;background:oklch(.42 calc(var(--c) * 1.2 + .02) var(--h2));animation:float2 42s ease-in-out infinite alternate}
.aura i:nth-child(3){left:30%;top:40%;width:35vmax;height:35vmax;background:oklch(.62 calc(var(--c) * .9 + .01) calc(var(--h) + 30));opacity:.3;animation:float3 30s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(18vw,12vh) scale(1.15)}}
@keyframes float2{to{transform:translate(-16vw,-14vh) scale(.9)}}
@keyframes float3{to{transform:translate(-10vw,10vh) scale(1.2)}}
.room-bar{position:relative;z-index:2;display:flex;justify-content:space-between;padding:18px var(--pad)}
.room-body{position:relative;z-index:1;height:calc(100dvh - 76px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,110px);align-items:center;
  padding:0 var(--pad) clamp(28px,6vh,72px);max-width:1500px;margin:0 auto}
.room-art{position:relative;justify-self:end;width:min(100%,62vh,640px);aspect-ratio:1}
.room-art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:8px;box-shadow:0 40px 100px -30px rgb(0 0 0/.75)}
.room-art .glow{will-change:opacity,transform}
.room-info{max-width:560px}
.room-info .display{font-size:clamp(2.6rem,5.6vw,5.4rem)}
.room-info .by{margin:16px 0 36px;color:var(--muted);font-size:1.1rem}
.room-time{display:grid;grid-template-columns:1fr;gap:8px}
.room-time .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.room-ctrl{display:flex;align-items:center;gap:18px;margin-top:26px}
.room-ctrl .icon-btn{width:52px;height:52px;color:var(--ink)}
.room-ctrl .icon-btn svg{width:24px;height:24px}
.room-ctrl .play{width:72px;height:72px}
.room-ctrl .play svg{width:28px;height:28px}
.room-vol{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted)}
.room-vol svg{width:18px;height:18px}
.room-vol .vol-btn{color:var(--muted)}
.room-vol input{width:120px}
.room.open .room-art,.room.open .room-info{animation:rise .7s var(--ease) both}
.room.open .room-info{animation-delay:.06s}

/* ---------- details sheet (native dialog) ---------- */
dialog.sheet{margin:0 0 0 auto;width:min(520px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;padding:0;border:0;background:var(--bg2);color:var(--ink);overflow:auto;
  box-shadow:-30px 0 80px -30px rgb(0 0 0/.7);opacity:0;transform:translateX(48px);
  transition:opacity .35s var(--ease),transform .5s var(--ease),overlay .5s allow-discrete,display .5s allow-discrete}
dialog.sheet[open]{opacity:1;transform:none}
@starting-style{dialog.sheet[open]{opacity:0;transform:translateX(48px)}}
dialog.sheet::backdrop{background:rgb(6 8 8/.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s,overlay .5s allow-discrete,display .5s allow-discrete}
dialog.sheet[open]::backdrop{opacity:1}
@starting-style{dialog.sheet[open]::backdrop{opacity:0}}
.sheet-in{padding:22px clamp(22px,4vw,40px) 48px}
.sheet-top{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:2;margin:-6px -12px 6px}
.sheet-top .icon-btn{background:oklch(.28 calc(var(--c) * .5) var(--h) / .8);backdrop-filter:blur(10px);color:var(--ink)}
.s-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:0 30px 70px -30px rgb(0 0 0/.8)}
.s-from{margin:28px 0 8px;color:var(--faint);font-size:13.5px}
.s-title{margin:0;font:400 clamp(2.2rem,5vw,3.2rem)/1 var(--serif);letter-spacing:-.015em}
.s-by{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin:30px 0;padding:22px 0;border-block:1px solid var(--line)}
.meta dt{color:var(--faint);font-size:12.5px}
.meta dd{margin:2px 0 0;font-weight:500}
.notes{margin-top:34px}
.notes h3{margin:0 0 12px;font:italic 400 1.5rem/1.2 var(--serif)}
.notes p{margin:0;font:400 1.22rem/1.6 var(--serif);color:oklch(.9 .01 var(--h));white-space:pre-wrap;max-width:60ch}

/* ---------- toast (top layer, so it shows above dialogs) ---------- */
#toast{position:fixed;inset:auto auto calc(var(--player-h) + 36px) 50%;margin:0;border:0;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:550;font-size:14px;
  box-shadow:0 14px 40px -12px rgb(0 0 0/.6);transform:translate(-50%,10px);opacity:0;transition:opacity .3s,transform .4s var(--ease),overlay .4s allow-discrete,display .4s allow-discrete}
#toast:popover-open,#toast.show{opacity:1;transform:translate(-50%,0)}
@starting-style{#toast:popover-open{opacity:0;transform:translate(-50%,10px)}}

/* ---------- view transitions ---------- */
::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .player{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"np ctrl" "time time";padding:10px 12px 8px;row-gap:4px}
  .np{grid-area:np}.ctrl{grid-area:ctrl}.time{grid-area:time}.side{display:none}
  :root{--player-h:118px}
}
@media (max-width:820px){
  .hero,.album{grid-template-columns:1fr}
  .hero-art{max-width:520px}
  .a-art{max-width:360px}
  .trk.flat{grid-template-columns:40px 44px minmax(0,1fr) auto 40px}
  .trk.flat .trk-rec,.trk .tag:not(.lock){display:none}
  .trk{grid-template-columns:40px minmax(0,1fr) auto 50px 40px;gap:10px}
  .room-body{grid-template-columns:1fr;align-content:center;gap:28px;overflow:auto}
  .room-art{justify-self:center;width:min(78vw,44vh)}
  .room-info{margin:0 auto;width:100%}
  .room-info .by{margin-bottom:22px}
  .room-vol{display:none}
  dialog.sheet{margin:auto 0 0;width:100vw;height:auto;max-height:90dvh;border-radius:20px 20px 0 0;transform:translateY(60px)}
  @starting-style{dialog.sheet[open]{transform:translateY(60px)}}
}
@media (max-width:600px){
  .top{flex-wrap:wrap;gap:12px}
  .brand{flex:1 1 100%}
  .search{flex:1 1 0;width:auto;min-width:0}
  .trk{grid-template-columns:36px minmax(0,1fr) 46px 36px;padding-right:4px}
  .trk.flat{grid-template-columns:36px 40px minmax(0,1fr) 36px}
  .trk.flat .trk-dur{display:none}
  .trk .tag{display:none}
  .np img{width:46px;height:46px}
  .ctrl .icon-btn{width:36px;height:36px}
}
@media (max-width:400px){.top{gap:10px}.search,.seg{flex:1 1 100%}.search{width:100%}}
@media (max-width:360px){.np-text{display:none}}
@media (prefers-reduced-motion:reduce){
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<dialog class="sheet" id="sheet" aria-label="Song details"><div class="sheet-in" id="sheetIn"></div></dialog>
<div id="toast" popover="manual" role="status"></div>

<script>
(() => {
'use strict';
const API = catalogueBase();
// A catalogue may give its files relative to itself (a home-made one does), so make every address whole.
function absolutise(list) {
  let base; try { base = new URL(API + '/', location.href).href; } catch (_) { return list || []; }
  const fix = u => { if (!u || typeof u !== 'string') return u; try { return new URL(u, base).href; } catch (_) { return u; } };
  for (const r of list || []) {
    if (r.artworkUrl) r.artworkUrl = fix(r.artworkUrl);
    if (r.buyUrl) r.buyUrl = fix(r.buyUrl);
    for (const t of r.tracks || []) { if (t.audioUrl) t.audioUrl = fix(t.audioUrl); if (t.artworkUrl) t.artworkUrl = fix(t.artworkUrl); }
  }
  return list || [];
}
// Where the catalogue lives: ?catalogue=… in the address, then BASE_URL, then this site.
function catalogueBase() {
  let q = new URLSearchParams(location.search).get('catalogue');
  try { if (q) { const u = new URL(q); q = /^https?:$/.test(u.protocol) ? u.origin + u.pathname : ''; } } catch (_) { q = ''; }
  const base = q || (typeof BASE_URL === 'string' ? BASE_URL : '') || (/^https?:$/.test(location.protocol) ? location.origin : '');
  let b = String(base).trim().replace(/\/+$/, '').replace(/\/catalogue$/, '');
  // A relative address (such as '..' in a home-made site) is taken from where this page lives.
  if (b && !/^[a-z][a-z0-9+.-]*:/i.test(b) && /^https?:$/.test(location.protocol)) b = new URL(b + '/', location.href).href.replace(/\/+$/, '');
  return b;
}
// Carries a chosen ?catalogue= along to this page's own links.
const CAT_QS = (() => { const c = new URLSearchParams(location.search).get('catalogue'); return c ? 'catalogue=' + encodeURIComponent(c) : ''; })();
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const root = document.documentElement;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- helpers ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = sec => { if (!isFinite(sec) || sec < 0) sec = 0; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + String(s).padStart(2, '0'); };
const hash = str => { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const joinFacts = arr => arr.filter(v => v !== undefined && v !== null && v !== '').map(esc).join(', ');
function artFallback(seed) {
  const h = hash(seed) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(.55 .08 ${h})"/><stop offset="1" stop-color="oklch(.25 .04 ${(h + 40) % 360})"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const I = {
  play: '<svg class="ico p" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L8.88 4.44A.9.9 0 0 0 7.5 5.2z"/></svg>',
  pause: '<svg class="ico pa" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
  lock: '<svg class="ico l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bars: '<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>',
  btnPlay: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L8.88 4.44A.9.9 0 0 0 7.5 5.2z"/></svg>',
  tagLock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>'
};

/* ---------------- state ---------------- */
let instance = {}, releases = [], allTracks = [];
const trackMap = new Map(), releaseMap = new Map();
const state = { view: 'home', albumId: null, query: '', selectedId: null, loaded: false, firstRender: true };

/* ---------------- toast ---------------- */
const toastEl = $('#toast'); let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  if (toastEl.showPopover) { try { toastEl.hidePopover(); } catch (_) {} toastEl.showPopover(); } else toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (toastEl.hidePopover) { try { toastEl.hidePopover(); } catch (_) {} } else toastEl.classList.remove('show'); }, 2200);
}

/* ---------------- tint from artwork (OKLCH) ---------------- */
let curH = 165;
const tintCache = new Map();
function rgbToOklch(r, g, b) {
  const lin = c => { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  const R = lin(r), G = lin(g), B = lin(b);
  const l = Math.cbrt(.4122214708 * R + .5363325363 * G + .0514459929 * B);
  const m = Math.cbrt(.2119034982 * R + .6806995451 * G + .1073969566 * B);
  const s = Math.cbrt(.0883024619 * R + .2817188376 * G + .6299787005 * B);
  const L = .2104542553 * l + .793617785 * m - .0040720468 * s;
  const A = 1.9779984951 * l - 2.428592205 * m + .4505937099 * s;
  const Bb = .0259040371 * l + .7827717662 * m - .808675766 * s;
  return [L, Math.hypot(A, Bb), (Math.atan2(Bb, A) * 180 / Math.PI + 360) % 360];
}
function applyTint(t) {
  const target = t.h; const nh = curH + (((target - curH) % 360) + 540) % 360 - 180; curH = nh;
  root.style.setProperty('--h', nh.toFixed(1));
  root.style.setProperty('--c', t.c.toFixed(3));
  root.style.setProperty('--h2', (nh + (((t.h2 - target) % 360) + 540) % 360 - 180).toFixed(1));
}
function hashTint(seed) { const h = hash(seed) % 360; return { h, c: .06, h2: (h + 50) % 360 }; }
function tintFrom(url, seed) {
  if (!url || url.startsWith('data:')) return applyTint(hashTint(seed || url));
  if (tintCache.has(url)) return applyTint(tintCache.get(url));
  const img = new Image(); img.crossOrigin = 'anonymous'; img.decoding = 'async';
  img.onload = () => {
    const run = () => {
      let t;
      try {
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, 32, 32);
        const d = x.getImageData(0, 0, 32, 32).data; const px = [];
        for (let i = 0; i < d.length; i += 4) px.push(rgbToOklch(d[i], d[i + 1], d[i + 2]));
        let sx = 0, sy = 0; const cs = [];
        for (const [L, C, H] of px) { if (L < .12 || L > .97) continue; const w = C * C; sx += Math.cos(H * Math.PI / 180) * w; sy += Math.sin(H * Math.PI / 180) * w; cs.push(C); }
        cs.sort((a, b) => a - b);
        const chroma = cs.length ? cs[Math.floor(cs.length * .8)] : 0;
        const h = (Math.atan2(sy, sx) * 180 / Math.PI + 360) % 360;
        let best = null;
        for (const [L, C, H] of px) { const dh = Math.abs(((H - h + 540) % 360) - 180); if (C > .05 && dh > 45 && (!best || C > best[1])) best = [L, C, H]; }
        t = { h, c: Math.min(.14, chroma), h2: best ? best[2] : (h + 45) % 360 };
      } catch (_) { t = hashTint(seed || url); }
      tintCache.set(url, t); applyTint(t);
    };
    (window.requestIdleCallback || (f => setTimeout(f, 1)))(run, { timeout: 300 });
  };
  img.onerror = () => { const t = hashTint(seed || url); tintCache.set(url, t); applyTint(t); };
  img.src = url;
}

/* ---------------- data ---------------- */
async function load() {
  renderSkeleton();
  try {
    const res = await fetch(API + '/catalogue', { cache: 'no-store' });
    if (!res.ok) throw new Error('The server replied ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.releases)) throw new Error('The reply had no releases in it');

  vols.forEach(v => { v.value = lv; v.style.setProperty('--p', pct); v.style.setProperty('--buf', pct); v.setAttribute('aria-valuetext', Math.round(lv * 100) + '%'); });
  document.body.classList.toggle('muted', lv === 0);
  document.body.classList.toggle('vol-low', lv > 0 && lv < .5);
  $$('.vol-btn').forEach(b => b.setAttribute('aria-label', lv === 0 ? 'Unmute' : 'Mute'));
}
function setVolume(v) { volume = v; muted = v === 0; audio.volume = volume; audio.muted = muted; paintVol(); }
function toggleMute() { if (muted) { if (volume === 0) volume = .6; muted = false; } else muted = true; audio.volume = volume; audio.muted = muted; paintVol(); }
vols.forEach(v => v.addEventListener('input', () => setVolume(+v.value)));
paintVol();

/* ---------------- long titles in the player: gentle ticker when they don't fit ---------------- */
function fitTickers() {
  requestAnimationFrame(() => document.querySelectorAll('.np-t,.np-s').forEach(box => {
    const inner = box.firstElementChild; if (!inner) return;
    box.classList.remove('over');
    const over = inner.scrollWidth - box.clientWidth;
    if (over > 2 && box.clientWidth > 0) {
      box.style.setProperty('--shift', -(over + 30) + 'px');
      box.style.setProperty('--dur', Math.max(9, 6 + over / 18).toFixed(1) + 's');
      box.classList.add('over');
    }
  }));
}
new ResizeObserver(fitTickers).observe(document.querySelector('.np'));

/* ---------------- render loop: runs only while playing ---------------- */
let looping = false, lvl = 0;
const lbuf = new Uint8Array(32), glow = $('#roomGlow');
function startLoop() { if (!looping && !document.hidden) { looping = true; requestAnimationFrame(loop); } }
function loop(now) {
  if (audio.paused || document.hidden) { looping = false; return; }
  syncTime();
  if (room.classList.contains('open') && !reduced) {
    let v;
    if (corsMode && analyser) { analyser.getByteFrequencyData(lbuf); let s = 0; for (let i = 0; i < 16; i++) s += lbuf[i]; v = Math.min(1, s / (16 * 255) * 1.3); }
    else v = .35 + .25 * Math.sin(now / 900);
    lvl += (v - lvl) * .12;
    glow.style.opacity = (.35 + lvl * .55).toFixed(3);
    glow.style.transform = `translateY(8%) scale(${(1 + lvl * .08).toFixed(3)})`;
  }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !audio.paused) startLoop(); });

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'view':
      if (state.query) { state.query = ''; $('#q').value = ''; }
      state.view = el.dataset.view; transition(() => { render(); scrollTo(0, 0); }); break;
    case 'open-album': openAlbum(id, (el.closest('.rec') && el.closest('.rec').querySelector('img')) || document.querySelector(`img[data-rid="${CSS.escape(id)}"]`)); break;
    case 'back': goBack(); break;
    case 'detail': openDetail(id); break;
    case 'play': {
      const t = trackMap.get(id);
      if (t && current && current.id === t.id) togglePlay();
      else playTrack(id, (state.view === 'songs' && !sheet.open) ? allTracks : null);
      break;
    }
    case 'play-album': { const r = releaseMap.get(id), f = r && r.tracks.find(t => !t.gated); if (f) playTrack(f.id, r.tracks); break; }
    case 'share': share(id); break;
    case 'share-current': if (current) share(current.id); break;
    case 'toggle': togglePlay(); break;
    case 'mute': toggleMute(); break;
    case 'prev': prev(); break;
    case 'next': next(false); break;
    case 'room-open': openRoom(); break;
    case 'room-close': closeRoom(); break;
    case 'room-details': if (current) openDetail(current.id); break;
    case 'sheet-close': sheet.close(); break;
    case 'clear-search': state.query = ''; $('#q').value = ''; state.view = 'home'; render(); break;
    case 'retry': load(); break;
  }
});
let qTimer, viewBeforeSearch = 'home';
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const v = e.target.value;
    if (v.trim()) { if (state.view !== 'search') viewBeforeSearch = state.view === 'album' ? 'home' : state.view; state.view = 'search'; }
    else if (state.view === 'search') state.view = viewBeforeSearch;
    state.query = v; render();
  }, 150);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && room.classList.contains('open') && !sheet.open) { closeRoom(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(false); }
});
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && !img.dataset.fallback) { img.dataset.fallback = '1'; img.src = artFallback(img.dataset.rid || img.src); }
}, true);
new IntersectionObserver(([en]) => $('#top').classList.toggle('scrolled', !en.isIntersecting)).observe($('#sentinel'));

load();
})();
</script>
